name: Collect jobs

on:
  schedule:
    # Two runs a night, so postings land before the 4:37 a.m. (New York) daily check. GitHub cron is UTC only and
    # has started scheduled runs 7 to 14 hours late here, so the main run starts the evening before.
    #   22:17 UTC Sun-Fri = 5:17 p.m. EST / 6:17 p.m. EDT
    #   05:17 UTC Mon-Sat = 12:17 a.m. EST / 1:17 a.m. EDT (backup; if it lands late, the next check picks it up)
    - cron: "17 22 * * 0-5"
    - cron: "17 5 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m collector.collect
      - name: Summarize what postings ask for
        continue-on-error: true
        run: python -m collector.analyze
      - name: Screen the past week's new postings
        run: python -m collector.screen
      - name: Commit results
        run: |
          git config user.name "jobs-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: collection $(date -u +%FT%H:%MZ)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || git rebase --abort
            git push
          fi
