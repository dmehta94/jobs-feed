name: Collect jobs

on:
  schedule:
    # Mondays 10:00 UTC (6:00 a.m. Eastern in summer, 5:00 a.m. in winter), ahead of the 7:19 a.m. digest
    - cron: "0 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m collector.collect
      - name: Summarize what postings ask for
        continue-on-error: true
        run: python -m collector.analyze
      - name: Email this week's postings
        if: always()
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          MIN_SALARY: ${{ vars.MIN_SALARY }}
          EXCLUDE_TERMS: ${{ vars.EXCLUDE_TERMS }}
          EXCLUDE_EMPLOYERS: ${{ vars.EXCLUDE_EMPLOYERS }}
          MAX_YEARS: ${{ vars.MAX_YEARS }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS }}
          MAX_PER_ORG: ${{ vars.MAX_PER_ORG }}
          MAX_NYC: ${{ vars.MAX_NYC }}
          MIN_FIT: ${{ vars.MIN_FIT }}
        run: python -m collector.email_digest
      - name: Commit results
        run: |
          git config user.name "jobs-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: weekly collection $(date -u +%F)"
            git push
          fi
