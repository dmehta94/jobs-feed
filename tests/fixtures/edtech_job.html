             "description" :"&lt;div&gt;&lt;strong&gt;Job Summary:&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;At the Center for Education Policy Research at Harvard University (CEPR) our mission is to transform education through the power of quality evidence. We believe that if we want to dramatically improve educational outcomes for all children, evidence must play a critical role.&lt;/div&gt;&lt;div&gt;The Math Teaching and Teacher Learning team at CEPR provides math-specific professional development to teachers and coaches to help improve math instruction. Our current grant-funded projects seek to develop and test an expanded math-specific coach training program (M-Powering Teacher Coaching) that uses machine-learning automated feedback and AI-enhanced coaching tools. The Data Scientist will contribute to this and other projects that connect rigorous educational research with practical tools for teachers, instructional coaches, and education leaders. This person will oversee, manage, and lead analysis and application of complex datasets, and contribute to the integration of research insights into innovative educational tools and cutting-edge products. They will be joining a team with faculty lead and Principal Investigator, Heather Hill, and collaborators at higher education research institutions, professional learning organizations, curriculum providers, and Enterprise AI firm(s).&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Job-Specific Responsibilities:&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;Key responsibilities of the Data Scientist include:&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Data and Research Infrastructure:&lt;/strong&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Organizes, cleans, and prepares structured and unstructured data (e.g., video, audio, text) for AI modeling and analysis.&lt;/li&gt;&lt;li&gt;Develops and documents codebooks, annotation protocols, data dictionaries, and other research procedures.&lt;/li&gt;&lt;li&gt;Builds and documents reproducible workflows for data processing, annotation, statistical analysis, and modeling.&lt;/li&gt;&lt;li&gt;Supports shared practices for version control, code review, data security, and reproducible research.&lt;/li&gt;&lt;li&gt;Maintains organized project files, code repositories, data documentation, and analytic records.&lt;/li&gt;&lt;/ul&gt;&lt;div&gt;&lt;strong&gt;Analysis and Measurement Development&lt;/strong&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Conduct data science work across grant-funded projects focused on teaching, instructional coaching, curriculum, and artificial intelligence in education.&lt;/li&gt;&lt;li&gt;Applies statistical, machine learning, natural language processing, and generative AI methods as appropriate.&lt;/li&gt;&lt;li&gt;Coordinates and executes the development and evaluation of automated measures related to teaching, coaching, curriculum implementation, and teacher learning.&lt;/li&gt;&lt;li&gt;Supports pilot studies and evaluation activities related to usability, implementation, coaching, and teacher experience.&lt;/li&gt;&lt;/ul&gt;&lt;div&gt;&lt;strong&gt;Product Development and Dissemination&lt;/strong&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Helps integrate research measures and findings into education tools and user interfaces.&lt;/li&gt;&lt;li&gt;Contributes to research papers, reports, public goods, funder deliverables, and other project materials (e.g., tables, figures, visualization, presentations, and technical documentation)&lt;/li&gt;&lt;/ul&gt;&lt;div&gt;&lt;strong&gt;Project Management and Cross-team Collaboration&lt;/strong&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Manages timelines and deliverables across one or more grant-funded workstreams&lt;/li&gt;&lt;li&gt;Collaborates with researchers, educators, software developers, and external partners such as Enterprise AI firm(s) to support project goals.&lt;/li&gt;&lt;li&gt;Oversees internal working groups to deliver on tasks and milestones&lt;/li&gt;&lt;/ul&gt;&lt;div&gt;Performs other duties as assigned.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Basic Qualifications&lt;/strong&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Bachelor&#039;s degree in Data Science, Statistics, Computer Science, Economics, Mathematics, Education, Social Science, or a related field.&lt;/li&gt;&lt;li&gt;Relevant experience, which may include professional, research, internship, or concurrent-with-baccalaureate experience in data science, statistical programming, machine learning, educational research, or a related field.&lt;/li&gt;&lt;li&gt;Must have strong organizational, communication, and problem-solving skills, with the ability to work independently and collaboratively.&lt;/li&gt;&lt;li&gt;Occasional travel may be required to support project meetings, trainings, pilot activities, or other research-related events.&lt;/li&gt;&lt;li&gt;Candidates should submit a resume or curriculum vitae and cover letter describing their relevant experience and interest in the position.&lt;/li&gt;&lt;li&gt;All candidates invited to the in-person/hybrid interview may be asked to complete a task and/or submit a sample program.&lt;/li&gt;&lt;/ul&gt;&lt;div&gt;This is a full-time, one-year term appointment beginning on the date of hire, with the possibility of continuation based on funding, performance, and departmental needs.&lt;/div&gt;&lt;div&gt;The work arrangement is remote, subject to project and departmental needs.&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Additional Qualifications and Skills:&lt;/strong&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Master&#039;s degree in data science, statistics, computer science, education, economics, social science, or a related field preferred.&lt;/li&gt;&lt;li&gt;Experience with R, Python, Stata, or a similar programming language preferred.&lt;/li&gt;&lt;li&gt;Experience with machine learning, natural language processing, generative AI, or automated scoring strongly preferred.&lt;/li&gt;&lt;li&gt;Experience with data annotation, codebook development, or qualitative and quantitative coding preferred.&lt;/li&gt;&lt;li&gt;Familiarity with building reproducible workflows for data cleaning, processing, analysis, or modeling preferred.&lt;/li&gt;&lt;li&gt;Familiarity with version control, databases, APIs, or collaborative software development preferred.&lt;/li&gt;&lt;li&gt;Experience with K-12 education data or education research is a plus.&lt;/li&gt;&lt;li&gt;Experience with mathematics teaching and learning is a plus.&lt;/li&gt;&lt;li&gt;Interest in improving education through responsible and evidence-based uses of artificial intelligence; commitment to equity, diversity, inclusion, and belonging.&lt;/li&gt;&lt;/ul&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Additional Information&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;Appointment End Date: One year from date of hire&lt;/div&gt;&lt;div&gt;Standard Hours/Schedule: 35 hours per week&lt;/div&gt;&lt;div&gt;Compensation Range/Rate (including Shift Differential if applicable): $90,000 - $95,000 commensurate with experience&lt;/div&gt;&lt;div&gt;Visa Sponsorship Information: Harvard University is unable to provide visa sponsorship for this position&lt;/div&gt;&lt;div&gt;Pre-Employment Screening: Identity and Education&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Work Format Details&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;This position has been determined by school or unit leaders that the duties and responsibilities can effectively be performed fully remotely at a non-Harvard location. Employees in fully remote positions must work all scheduled hours in a Harvard registered state in compliance with the University&#039;s Policy on Employment Outside of Massachusetts. At the discretion of the department, fully remote employees may occasionally be required on site at a Harvard location. Certain visa types and funding sources may limit work location. Individuals must meet work location sponsorship requirements prior to employment.&lt;/ elp all community members participate fully in work and campus life free from harassment and discrimination.&lt;/div&gt;",
